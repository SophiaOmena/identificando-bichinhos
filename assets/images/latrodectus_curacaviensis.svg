<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Latrodectus curacaviensis - Viúva-negra (Abdômen esférico preto brilhante com manchas vermelhas) -->
  <defs>
    <radialGradient id="latrodectusGloss" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
  </defs>

  <!-- Pernas pretas delgadas e arqueadas -->
  <g stroke="#111827" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M88 78 L55 50 L35 32 L20 18"/>
    <path d="M112 78 L145 50 L165 32 L180 18"/>
    <path d="M86 86 L45 75 L28 85 L14 105"/>
    <path d="M114 86 L155 75 L172 85 L186 105"/>
    <path d="M86 94 L42 110 L25 132 L18 160"/>
    <path d="M114 94 L158 110 L175 132 L182 160"/>
    <path d="M88 102 L55 138 L40 168 L32 195"/>
    <path d="M112 102 L145 138 L160 168 L168 195"/>
  </g>

  <!-- Cefalotórax pequeno preto -->
  <circle cx="100" cy="85" r="14" fill="#111827" stroke="#000000" stroke-width="1.5"/>

  <!-- ABDÔMEN GLOBOSO / ESFÉRICO PRETO LUSTROSO -->
  <circle cx="100" cy="130" r="32" fill="url(#latrodectusGloss)" stroke="#000000" stroke-width="2"/>

  <!-- MANCHAS VERMELHO-VIVAS NO ABDÔMEN (Desenho em ampulheta ou faixas vermelhas de Latrodectus) -->
  <g fill="#EF4444" stroke="#B91C1C" stroke-width="1.2">
    <!-- Mancha anterior -->
    <path d="M96 105 C96 102, 104 102, 104 105 L106 114 L94 114 Z"/>
    <!-- Mancha central em losango/cruz -->
    <polygon points="100,118 107,126 100,134 93,126"/>
    <!-- Manchas laterais -->
    <ellipse cx="82" cy="130" rx="3.5" ry="7" transform="rotate(-20 82 130)"/>
    <ellipse cx="118" cy="130" rx="3.5" ry="7" transform="rotate(20 118 130)"/>
    <!-- Mancha posterior -->
    <circle cx="100" cy="148" r="4.5"/>
  </g>
</svg>
