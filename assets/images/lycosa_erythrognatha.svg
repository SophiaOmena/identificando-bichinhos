<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Lycosa erythrognatha - Aranha-de-jardim / Lobo (Desenho em seta no abdômen, pelos alaranjados nas quelíceras) -->
  <defs>
    <radialGradient id="lycosaBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#71717A"/>
      <stop offset="70%" stop-color="#3F3F46"/>
      <stop offset="100%" stop-color="#18181B"/>
    </radialGradient>
  </defs>

  <!-- Pernas peludas cinza-escuras -->
  <g stroke="#3F3F46" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M85 85 L50 60 L30 45 L15 35"/>
    <path d="M115 85 L150 60 L170 45 L185 35"/>
    <path d="M82 95 L40 85 L20 95 L5 115"/>
    <path d="M118 95 L160 85 L180 95 L195 115"/>
    <path d="M82 108 L38 125 L22 150 L12 178"/>
    <path d="M118 108 L162 125 L178 150 L188 178"/>
    <path d="M85 120 L48 152 L32 180 L22 198"/>
    <path d="M115 120 L152 152 L168 180 L178 198"/>
  </g>

  <!-- Cefalotórax cinza com duas faixas longitudinais escuras -->
  <ellipse cx="100" cy="98" rx="20" ry="22" fill="url(#lycosaBody)" stroke="#18181B" stroke-width="2"/>
  <line x1="93" y1="80" x2="93" y2="116" stroke="#18181B" stroke-width="3"/>
  <line x1="107" y1="80" x2="107" y2="116" stroke="#18181B" stroke-width="3"/>

  <!-- Abdômen com DESENHO EM FORMATO DE SETA / FLECHA (Marca de Lycosa) -->
  <ellipse cx="100" cy="145" rx="20" ry="28" fill="url(#lycosaBody)" stroke="#18181B" stroke-width="2"/>

  <!-- Desenho em seta preta com borda clara no dorso -->
  <g fill="#09090B" stroke="#E4E4E7" stroke-width="1.2">
    <!-- Ponta da seta apontada para frente -->
    <polygon points="100,122 108,136 103,136 103,155 97,155 97,136 92,136"/>
    <!-- Chevrons / V invertidos atrás da seta -->
    <path d="M94 158 L100 164 L106 158" fill="none" stroke-width="2"/>
    <path d="M95 166 L100 171 L105 166" fill="none" stroke-width="2"/>
  </g>

  <!-- Quelíceras com pelos alaranjados -->
  <rect x="91" y="72" width="7" height="10" rx="2" fill="#F97316"/>
  <rect x="102" y="72" width="7" height="10" rx="2" fill="#F97316"/>
</svg>
